# Blueprint Render.com — TreviaApp Beta
# ---------------------------------------------------------
# Como usar:
#   1. Copie este arquivo para o repositorio como render.yaml
#   2. No Render: "Blueprint" -> "New from YAML"
#   3. Substitua SECRETS abaixo (CHAVES JWT / SENHAS) antes de deployar
services:
  - type: web
    name: treviaapp-postgres
    runtime: docker
    repo: https://github.com/trevia-app/trevia.app
    rootDir: .
    dockerCommand: |
      # Postgres gerenciado (melhor criar manualmente; este entrypoint alternativa)
      echo "Use PostgreSQL Gerenciado pelo Render. Veja docs/RENDERER.md"
    plan: free
    envVars:
      - fromGroup: treviaapp-db

  - type: web
    name: treviaapp-api
    runtime: docker
    repo: https://github.com/trevia-app/trevia.app
    dockerfilePath: ./src/TreviaApp.Api/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health/ready
    numInstances: 1
    autoDeploy: yes
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: PORT
        value: "10000"
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: treviaapp-db
          property: connectionString
      - key: Jwt__Issuer
        sync: false
        generateValue: true
      - key: Jwt__Audience
        sync: false
        generateValue: true
      - key: Jwt__Key
        sync: false
        generateValue: true
      - key: Jwt__AccessTokenMinutes
        value: "15"
      - key: Jwt__RefreshTokenDays
        value: "30"
      - key: Cors__AllowedOrigins__0
        value: https://treviaapp-client.onrender.com
      - key: AdminSeed__Email
        value: admin@trevia.app
      - key: AdminSeed__Password
        sync: false
        generateValue: true
      - key: FileStorage__Provider
        value: Local
      - key: FileStorage__RootPath
        value: /app_data/files
      - key: Serilog__MinimumLevel__Default
        value: Information
      - key: ApiOptions__UseDetailedErrors
        value: "false"

  - type: web
    name: treviaapp-client
    runtime: static
    repo: https://github.com/trevia-app/trevia.app
    buildCommand: |
      curl -sSL https://dot.net/v1/dotnet-install.sh | bash /dev/stdin --channel LTS --install-dir /opt/dotnet
      export DOTNET_ROOT=/opt/dotnet
      export PATH=$DOTNET_ROOT/tools:$DOTNET_ROOT:$PATH
      dotnet workload install wasm-tools
      dotnet publish src/TreviaApp.Client/TreviaApp.Client.csproj \
        -c Release \
        -o ./dist \
        /p:GZipCompression=true
    publishDir: dist/wwwroot
    staticPublishPath: ./dist/wwwroot
    pullRequestPreviewsEnabled: no
    buildFilter:
      paths:
        - src/TreviaApp.Client/**
    envVars:
      - key: API_BASE_URL
        value: https://treviaapp-api.onrender.com

  - type: cronjob
    name: treviaapp-run-migrations
    runtime: docker
    repo: https://github.com/trevia-app/trevia.app
    dockerfilePath: ./src/TreviaApp.Api/Dockerfile
    dockerContext: .
    schedule: 0 */22 * * 0
    plan: free
    command: dotnet TreviaApp.Api.dll --migrate-only
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: treviaapp-db
          property: connectionString

databases:
  - name: treviaapp-db
    plan: free
    databaseName: treviaapp_prod
    user: treviaapp
    postgresMajorVersion: "17"
